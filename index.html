<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events — Roles &amp; Responsibilities</title>
<style>
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f8fafc;
    --bg-tertiary: #f1f5f9;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-tertiary: #94a3b8;
    --border: #e2e8f0;
    --border-md: #cbd5e1;
    --radius-md: 8px;
    --radius-lg: 12px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg-primary); color: var(--text-primary); padding: 24px; max-width: 960px; }
  h1 { font-size: 22px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }
  .flow { display: flex; align-items: stretch; border-radius: var(--radius-lg); border: 1px solid var(--border); overflow: hidden; margin-bottom: 16px; }
  .phase-btn { flex: 1; padding: 10px 6px; text-align: center; cursor: pointer; border: none; background: var(--bg-secondary); border-right: 1px solid var(--border); transition: background .15s; position: relative; min-width: 0; }
  .phase-btn:last-child { border-right: none; }
  .phase-btn .pnum { font-size: 10px; color: var(--text-tertiary); margin-bottom: 3px; }
  .phase-btn .pname { font-size: 12px; font-weight: 600; color: var(--text-secondary); line-height: 1.3; }
  .phase-btn.active { background: var(--bg-primary); }
  .phase-btn.active .pname { color: var(--text-primary); }
  .phase-btn.active::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: var(--accent); border-radius: 2px 2px 0 0; }
  .detail { background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; min-height: 200px; }
  .detail-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
  .phase-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
  .phase-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .event-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .etab { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; cursor: pointer; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-secondary); transition: all .12s; }
  .etab.active { color: #fff; border-color: transparent; }
  .col-hdrs { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .col-hdr { font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 5px; text-align: center; letter-spacing: .03em; }
  .buckets { display: flex; flex-direction: column; gap: 0; }
  .bucket-item { margin-bottom: 8px; }
  .bucket-name { font-size: 12px; font-weight: 600; color: var(--text-secondary); padding: 5px 0 6px; border-top: 1px solid var(--border); }
  .bucket-name:first-of-type { border-top: none; }
  .bucket-raci { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; }
  .chip { font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 5px; text-align: center; line-height: 1.35; word-break: break-word; }
  .chip-empty { font-size: 11px; color: var(--text-tertiary); text-align: center; padding: 4px 0; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .leg-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); }
  .leg-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .empty-msg { font-size: 13px; color: var(--text-tertiary); padding: 8px 0; }
</style>
</head>
<body>

<h1>Events — roles &amp; responsibilities</h1>
<p class="subtitle">Master reference &nbsp;·&nbsp; 4 event types &nbsp;·&nbsp; Click a phase, then select your event type</p>

<div class="flow" id="flow"></div>
<div class="detail" id="detail"></div>

<div class="legend">
  <div class="leg-item"><div class="leg-dot" style="background:#1e3a5f"></div>R — Responsible (executes the work)</div>
  <div class="leg-item"><div class="leg-dot" style="background:#064e3b"></div>A — Accountable (owns the outcome)</div>
  <div class="leg-item"><div class="leg-dot" style="background:#78350f"></div>C — Consulted (input before decisions)</div>
  <div class="leg-item"><div class="leg-dot" style="background:#374151"></div>I — Informed (kept in the loop)</div>
</div>

<script>
var PHASES=[
  {name:"Ideation &\napproval",color:"#7c3aed",sub:"Concept, positioning, budget"},
  {name:"Campaign &\nplanning",color:"#1d4ed8",sub:"LP, registration, campaign setup"},
  {name:"Creative &\ncontent",color:"#0f766e",sub:"Design, copy, demos, speakers"},
  {name:"Comms &\nenablement",color:"#b45309",sub:"Internal, external, sales tools"},
  {name:"On-site\nexecution",color:"#be185d",sub:"Logistics, on-site management"},
  {name:"Follow-up &\nreporting",color:"#374151",sub:"Pipeline, post-event, reporting"}
];

var EVENTS=["Tier 1 Global","Sponsorships","Tech Leaders","Industry Events"];
var ECOLORS=["#1d4ed8","#7c3aed","#0f766e","#b45309"];

var DATA={
  0:{
    "Tier 1 Global":[
      {b:"Event ideation + approval",R:"EM",A:"EM, PM, ECO",C:"MLT, ECO, SPARK, SALES",I:"FM, CPs/BDMs"},
      {b:"Event positioning + messaging",R:"Content",A:"EM, PM, ECO",C:"MLT, ECO, SPARK, SALES",I:"ALL"},
      {b:"Budget management + admin",R:"EM",A:"EM",C:"MLT, ECO",I:"MLT, ECO"},
      {b:"Sponsorship + exhibit booth",R:"EM",A:"EM",C:"MLT, ECO",I:"ALL"}
    ],
    "Sponsorships":[
      {b:"Event ideation + approval",R:"FM",A:"FM, IMD",C:"IMD, HOM, SME",I:"EXEC, IMD, CP, BDM"},
      {b:"Event positioning + messaging",R:"FM",A:"FM, IMD",C:"VM, CON, HOM, Events",I:"ALL"},
      {b:"Sponsorship + exhibit booth",R:"FM",A:"FM",C:"Events",I:"HOM, IMD, SALES, EXEC"}
    ],
    "Tech Leaders":[
      {b:"Event ideation + approval",R:"EP",A:"EP",C:"HOM, IMD, EXEC, FM",I:"EXEC, CP/BDM, ECO, VM"},
      {b:"Venue + event planning",R:"EP",A:"EP",C:"FM, HOM, IMD",I:"ALL"}
    ],
    "Industry Events":[
      {b:"Event ideation + approval",R:"FM",A:"FM, IMD",C:"IND, HOM, SME",I:"EXEC, IMD, CP, BDM"},
      {b:"Venue + event planning",R:"FM",A:"FM",C:"IMD, HOM, Events",I:"—"}
    ]
  },
  1:{
    "Tier 1 Global":[
      {b:"Campaign setup",R:"CI, CS",A:"EM, CS",C:"—",I:"ALL"},
      {b:"Landing page + registration",R:"CS",A:"CS",C:"EM, CON, PM, DES",I:"ALL"},
      {b:"Meeting mgmt (EBCs)",R:"SALES, SPARK, ECO",A:"ECO, BIMDS",C:"EM, PM",I:"ALL"},
      {b:"TW attendee management",R:"EM",A:"SPARK, ECO, EXEC, SALES, MLT",C:"CPs/PM, IMD",I:"ALL"}
    ],
    "Sponsorships":[
      {b:"Campaign setup",R:"CI",A:"FM",C:"—",I:"IND, CP/BDM"},
      {b:"Landing page + registration",R:"FM",A:"FM",C:"Events, IMD, SME",I:"ALL"},
      {b:"Meeting management",R:"IMD, CP, BDM",A:"IMD",C:"FM",I:"ALL"}
    ],
    "Tech Leaders":[
      {b:"Campaign setup",R:"CI",A:"EP",C:"—",I:"ALL"},
      {b:"Event LP + registration",R:"EP",A:"EP",C:"Events, IMD, SME",I:"ALL"}
    ],
    "Industry Events":[
      {b:"Campaign setup",R:"CI",A:"FM",C:"—",I:"IMD, CP/BDM"},
      {b:"Event LP + registration",R:"FM",A:"FM",C:"Events, IMD/SME",I:"IMD, CP/BDM, HOM"}
    ]
  },
  2:{
    "Tier 1 Global":[
      {b:"Creative, design + print",R:"CS, DES",A:"CS, EM",C:"PM, ECO, MLT",I:"ALL"},
      {b:"Demos",R:"SME, SA",A:"ECO",C:"VM, SPARK",I:"ALL"},
      {b:"Content + speaking opps",R:"PM",A:"PM",C:"FM, SALES, ECO, SPARK",I:"ALL"},
      {b:"Content capture",R:"CA, MM",A:"PR",C:"PM, VM, EM, SLM, ECO",I:"ALL"}
    ],
    "Sponsorships":[
      {b:"Creative, design + printing",R:"Design",A:"FM",C:"Events",I:"ALL"},
      {b:"Content + demos",R:"SME, SA, SPARK",A:"IMD",C:"FM, VM",I:"VM, ECO"}
    ],
    "Tech Leaders":[
      {b:"Creative, design + printing",R:"Design",A:"EP",C:"ECO, PM",I:"ALL"},
      {b:"Content + speakers",R:"SME, IMD",A:"EP",C:"VM, FM",I:"ALL"}
    ],
    "Industry Events":[
      {b:"Creative, design + printing",R:"Design",A:"FM",C:"—",I:"EXEC, IND, BDM, Events"},
      {b:"Content",R:"SME, IMD",A:"FM",C:"SME, Eco, SPARK, VM",I:"EXEC, HOM, SALES, All"}
    ]
  },
  3:{
    "Tier 1 Global":[
      {b:"Sales enablement",R:"EM",A:"EM",C:"ECO, SALES, SPARK",I:"ALL"},
      {b:"Promotions (social, PR, paid)",R:"PR, CS",A:"EM, CS",C:"CON, ECO, ADS",I:"ALL"},
      {b:"Comms (in + ex)",R:"MLM, PM, CS",A:"EM, CS",C:"PM, CS, ECO",I:"ALL"}
    ],
    "Sponsorships":[
      {b:"Sales enablement",R:"FM",A:"FM, IMD",C:"IMD, CP, BDM",I:"EXEC, HOM"},
      {b:"Comms (in + ex)",R:"FM, IMD/CP/BDM",A:"FM, IMD",C:"CON, IMD, CP, BDM",I:"ALL"},
      {b:"Promotions",R:"PR",A:"FM",C:"IMD, Events",I:"ALL"}
    ],
    "Tech Leaders":[
      {b:"Sales enablement",R:"EP",A:"EP, IMD",C:"FM, IMD",I:"ALL"},
      {b:"Comms (in + ext)",R:"EP, FM",A:"EP",C:"VM, FM",I:"ALL"}
    ],
    "Industry Events":[
      {b:"Sales enablement",R:"FM",A:"FM / IMD",C:"IMD, CP/BDM",I:"EXEC, HOM"},
      {b:"Internal comms",R:"FM",A:"FM",C:"—",I:"EXEC, IMD, BDM, HOM"},
      {b:"External comms",R:"FM, IMDS/CP/BDM",A:"IMD",C:"IMD, CP/BDM/SME",I:"—"}
    ]
  },
  4:{
    "Tier 1 Global":[
      {b:"On-site execution",R:"EM, PM, PR, MM",A:"EM",C:"—",I:"ALL"},
      {b:"Booth staffing",R:"ECO, EM, BDMs",A:"EM",C:"SPARK, ECO, SALES",I:"ALL"},
      {b:"Ancillary events",R:"EM, FM, PM, EP",A:"EM, PM, CS",C:"ECO, SALES, MLT, SPARK",I:"ALL"}
    ],
    "Sponsorships":[
      {b:"On-site execution",R:"FM (Events)",A:"FM",C:"Events",I:"—"},
      {b:"Ancillary events",R:"FM, PM",A:"FM, IMD",C:"Events, ECO, HOM, IMD",I:"ALL"}
    ],
    "Tech Leaders":[
      {b:"On-site execution",R:"EP or FM",A:"EP",C:"—",I:"—"}
    ],
    "Industry Events":[
      {b:"On-site execution",R:"FM, CPs/BDMs",A:"FM",C:"Events",I:"—"}
    ]
  },
  5:{
    "Tier 1 Global":[
      {b:"Follow-up",R:"CPs, BDMs",A:"IMD, NB, PS",C:"EM, PM, ECO, SPARK",I:"SPARK, ECO, SALES"},
      {b:"Post-event report",R:"EM, PM, CS",A:"EM, PM",C:"SALES, ECO, Social, Paid",I:"ALL"},
      {b:"Awards",R:"PM, ECO, FM, SALES",A:"PM",C:"Sales + ECO",I:"ALL"}
    ],
    "Sponsorships":[
      {b:"Follow-up",R:"CPs, BDM",A:"IMD",C:"FM",I:"EXEC, HOM, ECO"},
      {b:"Post-event report",R:"FM",A:"FM",C:"IMD, CP, BDM",I:"ALL"}
    ],
    "Tech Leaders":[
      {b:"PE follow-up",R:"CP, BDM",A:"IMD",C:"EP",I:"EXEC, HOM"},
      {b:"PE reporting",R:"EP",A:"EP",C:"IMD/CP/BDM",I:"ALL"}
    ],
    "Industry Events":[
      {b:"Follow-up + pipeline conversion",R:"CPs/BDMs",A:"IMD",C:"IMD/CP/BDM",I:"ALL"},
      {b:"Post-event reporting",R:"FM",A:"FM",C:"Events",I:"—"}
    ]
  }
};

var activePhase=0, activeEvent=0;

function chip(val,type){
  if(!val||val==="—")return'<span class="chip-empty">—</span>';
  var bg=type==="R"?"#1e3a5f":type==="A"?"#064e3b":type==="C"?"#78350f":"#374151";
  var fg=type==="R"?"#93c5fd":type==="A"?"#6ee7b7":type==="C"?"#fcd34d":"#d1d5db";
  return'<span class="chip" style="background:'+bg+';color:'+fg+'">'+val+'</span>';
}

function renderFlow(){
  var f=document.getElementById('flow');
  f.innerHTML=PHASES.map(function(p,i){
    return'<button class="phase-btn'+(i===activePhase?' active':'')+'" style="--accent:'+p.color+'" onclick="setPhase('+i+')">'
      +'<div class="pnum">Phase '+(i+1)+'</div>'
      +'<div class="pname">'+p.name.replace('\n','<br>')+'</div>'
      +'</button>';
  }).join('');
}

function renderDetail(){
  var p=PHASES[activePhase];
  var evtName=EVENTS[activeEvent];
  var rows=(DATA[activePhase]&&DATA[activePhase][evtName])||[];

  var tabs=EVENTS.map(function(e,i){
    var active=i===activeEvent;
    return'<button class="etab'+(active?' active':'')+'" '
      +(active?'style="background:'+ECOLORS[i]+';border-color:'+ECOLORS[i]+'"':' ')
      +' onclick="setEvent('+i+')">'+e+'</button>';
  }).join('');

  var colHdrs=[
    {l:"R — Responsible",bg:"#1e3a5f",fg:"#93c5fd"},
    {l:"A — Accountable",bg:"#064e3b",fg:"#6ee7b7"},
    {l:"C — Consulted",bg:"#78350f",fg:"#fcd34d"},
    {l:"I — Informed",bg:"#374151",fg:"#d1d5db"}
  ];
  var hdrsHtml='<div class="col-hdrs">'+colHdrs.map(function(h){
    return'<div class="col-hdr" style="background:'+h.bg+';color:'+h.fg+'">'+h.l+'</div>';
  }).join('')+'</div>';

  var bucketsHtml=rows.length===0
    ?'<div class="empty-msg">No specific buckets assigned in this phase for this event type.</div>'
    :rows.map(function(r){
      return'<div class="bucket-item">'
        +'<div class="bucket-name">'+r.b+'</div>'
        +'<div class="bucket-raci">'
        +chip(r.R,'R')+chip(r.A,'A')+chip(r.C,'C')+chip(r.I,'I')
        +'</div></div>';
    }).join('');

  document.getElementById('detail').innerHTML=
    '<div class="detail-hdr">'
      +'<div class="dot" style="background:'+p.color+'"></div>'
      +'<div><div class="phase-title">Phase '+(activePhase+1)+' — '+p.name.replace('\n',' ')+'</div>'
      +'<div class="phase-sub">'+p.sub+'</div></div>'
    +'</div>'
    +'<div class="event-tabs">'+tabs+'</div>'
    +hdrsHtml
    +'<div class="buckets">'+bucketsHtml+'</div>';
}

function setPhase(i){activePhase=i;renderFlow();renderDetail();}
function setEvent(i){activeEvent=i;renderDetail();}

renderFlow();
renderDetail();
</script>

</body>
</html>
